<!doctype html>
<html lang="en" class="dark" data-theme="midnight">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0E14" />
    <meta
      name="description"
      content="Guitar Utility Tool."
    />
    <script>
      try {
        const savedTheme = window.localStorage.getItem("fretlab.theme");
        if (savedTheme === '"studio"' || savedTheme === '"amethyst"') {
          document.documentElement.dataset.theme = JSON.parse(savedTheme);
        }
      } catch {
        // Keep the default theme when browser storage is unavailable or invalid.
      }
    </script>
    <title>FretLab</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
